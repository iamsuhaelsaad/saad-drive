<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saad Drive</title><style>body{font-family:system-ui;margin:0;background:#eef7f3;color:#173a32;display:grid;place-items:center;min-height:100vh}.box{width:min(440px,calc(100% - 40px));padding:32px;border:1px solid #c9ded6;border-radius:24px;background:#ffffffcc;box-shadow:0 18px 60px #295d4c22}input,button{width:100%;height:46px;border-radius:12px;border:1px solid #c9ded6;box-sizing:border-box;padding:0 14px;font:inherit}button{margin-top:12px;background:#3c9b80;color:#fff;font-weight:700;cursor:pointer}.error{height:20px;color:#b93831;font-size:13px;margin-top:8px}</style></head><body><main class="box"><h1>Saad Drive</h1><p>Secure workspace starter. The original dashboard can be placed here after backend wiring.</p><form id="f"><input id="p" type="password" inputmode="numeric" placeholder="Access PIN"><div id="e" class="error"></div><button>Unlock workspace</button></form></main><script>const f=document.querySelector('#f'),p=document.querySelector('#p'),e=document.querySelector('#e');f.addEventListener('submit',async x=>{x.preventDefault();e.textContent='';const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin:p.value})});const d=await r.json();if(r.ok){sessionStorage.setItem('saadDriveToken',d.token);location.href='/dashboard.html'}else e.textContent=d.error||'Unlock failed'});</script></body></html>
